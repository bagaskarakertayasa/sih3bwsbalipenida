<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIH3 | Wilayah Sungai Bali Penida</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="gambar/bali.png" type="image/png">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --ink: #1e293b;
            /* slate-800 */
            --gold: #f59e0b;
            /* amber-500 */
            --mist: #f8fafc;
            /* slate-50 */
        }

        html,
        body {
            font-family: 'Poppins', sans-serif;
            color: var(--ink);
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen flex flex-col justify-between font-sans antialiased">

    <main class="w-full max-w-[100vw] px-4 pt-8 flex-grow flex flex-col items-center">
        <div class="w-full max-w-7xl flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
            <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-slate-800">
                Peta Hidrogeologi
            </h1>
            <a href="#" onclick="history.back(); return false;"
                class="inline-flex items-center gap-2 px-4 py-2 bg-white hover:bg-slate-100 text-slate-700 text-sm font-medium rounded-xl border border-slate-200/80 shadow-sm transition duration-200 group">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5"
                    stroke="currentColor" class="w-4 h-4 transform group-hover:-translate-x-1 transition-transform">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                </svg>
                Kembali ke Beranda
            </a>
        </div>

        <div class="w-full max-w-7xl bg-white rounded-xl shadow-md border border-slate-200/80 p-2 overflow-hidden flex justify-center items-center">
            <img src="gambar/Peta_Hidrogeologi.jpg" alt="Peta Hidrogeologi Wilayah Sungai Bali Penida" class="w-full h-auto object-contain rounded-lg">
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200/80 py-6 mt-12">
        <div
            class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-4 text-sm text-slate-500">
            <div>
                &copy; 2026 Balai Wilayah Sungai Bali Penida.
            </div>
            <div class="flex gap-4">
                Sumber : Berita SIH3
            </div>
        </div>
    </footer>

</body>

</html>
